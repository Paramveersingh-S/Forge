[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-llm"
version = "0.1.0"
description = "Rust-accelerated LLM fine-tuning with built-in provenance. One YAML, one command, done."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Paramveersingh S", email = "forge@users.noreply.github.com" },
]
keywords = ["llm", "fine-tuning", "lora", "qlora", "machine-learning", "rust", "triton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Light install: CLI + config + data tools, no PyTorch.
dependencies = [
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.16.0",
    "packaging>=21.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Training stack — `pip install "forge-llm[train]"` to fine-tune.
train = [
    "torch>=2.0.0",
    "transformers>=4.36.0,<5.0.0",
    "peft>=0.7.0",
    "trl>=0.14.0",
    "datasets>=2.14.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
]
# Custom Triton kernels for fused LoRA operations.
kernels = [
    "triton>=2.1.0",
]
# Experiment tracking export.
trackers = [
    "mlflow>=2.0.0",
    "wandb>=0.15.0",
]
# Evaluation harness.
eval = [
    "lm-eval>=0.4.0",
]
# Data quality tools.
data = [
    "datasketch>=1.6.0",
    "scikit-learn>=1.0.0",
]
# Adapter signing.
sign = [
    "cryptography>=41.0.0",
]
# Web dashboard and API server.
dashboard = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]
# Serving (inference API).
serve = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
# DeepSpeed multi-GPU.
deepspeed = [
    "deepspeed>=0.12.0",
]
# Development.
dev = [
    "forge-llm[train,data,sign,dashboard]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "httpx>=0.24.0",
]
# Everything.
all = [
    "forge-llm[train,kernels,trackers,eval,data,sign,dashboard,serve,deepspeed]",
]


[project.scripts]
forge = "forge.cli.app:run"

[project.urls]
Homepage = "https://github.com/Paramveersingh-S/Forge"
Repository = "https://github.com/Paramveersingh-S/Forge"
Issues = "https://github.com/Paramveersingh-S/Forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["N806", "N812", "E501", "B017", "F821", "F841", "SIM105", "E741", "F401", "SIM103", "B904", "N803", "B007", "SIM108"]

[tool.mypy]
python_version = "3.10"
files = ["src/forge"]
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: slow smoke tests that download models and run training",
    "unit: fast isolated tests — no subprocess, network, filesystem, or real model load",
    "integration: tests that touch real subprocess, SQLite, filesystem, or HTTP",
    "gpu: tests that require a CUDA GPU",
]
addopts = "-m 'not smoke and not gpu' --cov=forge --cov-report=term-missing:skip-covered"
