[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"
authors = ["Paramveersingh S"]
description = "Rust core for Forge — async DMA layer streaming, zero-copy safetensors, ed25519 signing"
license = "Apache-2.0"
repository = "https://github.com/Paramveersingh-S/Forge"

[lib]
name = "forge_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python FFI
pyo3 = { version = "0.22", features = ["extension-module"] }
# Memory-mapped I/O
memmap2 = "0.9"
# Async runtime for DMA scheduling
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "macros"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cryptographic signing
ed25519-dalek = { version = "2", features = ["hazmat", "rand_core"] }
zeroize = "=1.8.1"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
# Error handling
thiserror = "2"
anyhow = "1"
# Logging
log = "0.4"
pyo3-log = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = []
